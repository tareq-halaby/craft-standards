name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-test:
    name: Standards Audit & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Audit Standards Metadata
        run: cargo run --manifest-path xtask/Cargo.toml -- audit

      - name: Run MCP Server Tests
        run: cargo test --manifest-path crates/craft-standards-mcp/Cargo.toml

      - name: Check Workspace
        run: cargo check --workspace
