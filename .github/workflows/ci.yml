name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit:
    name: Standards Audit & MCP Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Audit Standards Metadata
        run: cargo run --manifest-path xtask/Cargo.toml -- audit

      - name: Check MCP Server
        run: cargo check --manifest-path crates/craft-standards-mcp/Cargo.toml
